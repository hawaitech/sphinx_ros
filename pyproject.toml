[project]
name = "sphinx-ros"
version = "0.2.0"
description = "Sphinx extension to document ROS packages."
readme = "README.rst"
authors = [
    { name = "HawAI.tech", email = "tech@hawaitech.com" }
]
requires-python = ">=3.12"
dependencies = [
    "sphinx>=7.0"
]

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"
